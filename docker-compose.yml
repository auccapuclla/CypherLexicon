version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cypherlexicon-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-lexicon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lexicon_password}
      POSTGRES_DB: ${DB_NAME:-lexicon_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
